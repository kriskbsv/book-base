<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant:ital,wght@0,300..700;1,300..700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=2">
  <title>Book-Club</title>
</head>
<body>
    <main class="app">
      <section class="app__header">
        <div class="app__logo">
            <p class="app__logo-text">BOOK BASE</p>
        </div>
        <h1 class="app__title">Книжный клуб<br> для тех, кто любит<br> читать и обсуждать.</h1>
        <p class="app__description">Встречаемся, читаем <br>и делимся мыслями о книгах.</p>
      </section>

      <section class="app__content reveal reveal-1">
        <div class="app__content-wrapper">
            <h2 class="app__content-title">Ближайшая встреча</h2>
            <div class="app__content-item">
                <img src="images/mag-sm.jpg" alt="Обложка книги" class="app__content-item-image" id="meetingCover">
                <div class="app__content-item-info">
                    <h3 class="app__content-item-title" id="meetingTitle">"Маг"</h3>
                    <p class="app__content-item-author" id="meetingAuthor">Сомерсет Моэм</p>
                    <p class="app__content-item-date" id="meetingDate">28 июня</p>
                    <p class="app__content-item-time" id="meetingTime">16:00</p>
                </div>
            </div>
            <button href="#" class="app__content-link" id="joinMeetingButton">Я приду</button>
            <div id="homeAttendees"></div>
        </div>
      </section>

      <section class="feed" id="quotesFeedSection" style="display:none;">
        <h2 class="feed__title">Из читательских дневников</h2>
        <div id="quotesFeed"></div>
      </section>

    <div class="app__footer">
        <ul class="app__bottom-nav">
        <li class="app__bottom-nav-item">
          <a href="index.html" class="app__footer-link app__footer-link_active">
            <svg class="app__footer-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.6 12 3l9 7.6"/><path d="M5.2 9.4V20a1 1 0 0 0 1 1H9v-5.5h6V21h2.8a1 1 0 0 0 1-1V9.4"/></svg>
            Главная
          </a>
        </li>
        <li class="app__bottom-nav-item">
          <a href="meetings.html" class="app__footer-link">
            <svg class="app__footer-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 6.6C10.4 5.2 7.8 4.7 5 5.2V18c2.8-.5 5.4 0 7 1.4 1.6-1.4 4.2-1.9 7-1.4V5.2c-2.8-.5-5.4 0-7 1.4Z"/><path d="M12 6.6v12.8"/></svg>
            Встречи
          </a>
        </li>
        <li class="app__bottom-nav-item">
          <a href="participants.html" class="app__footer-link">
            <svg class="app__footer-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8.4" r="2.7"/><path d="M3.8 19.4a5.2 5.2 0 0 1 10.4 0"/><circle cx="17" cy="9" r="2.1"/><path d="M16.2 13.6a4.4 4.4 0 0 1 4.5 4.9"/></svg>
            Участники
          </a>
        </li>
        <li class="app__bottom-nav-item">
          <a href="profile.html" class="app__footer-link">
            <svg class="app__footer-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8.4" r="3.2"/><path d="M5.6 20a6.4 6.4 0 0 1 12.8 0"/></svg>
            Профиль
          </a>
        </li>
      </ul>
    </div>
    </main>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>
</body>
</html>
