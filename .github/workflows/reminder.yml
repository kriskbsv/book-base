name: Напоминание о встрече

# Запуск по расписанию + вручную из вкладки Actions.
# cron указывается в UTC. Пример ниже — каждую среду в 09:00 UTC.
on:
  schedule:
    - cron: "0 9 * * 3"
  workflow_dispatch:

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Отправить напоминания
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          WEBAPP_URL: ${{ secrets.WEBAPP_URL }}
        run: node bot/notify.js
